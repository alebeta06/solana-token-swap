# Two jobs, one per scope. The 27 Anchor integration tests are left out on
# purpose — they need the Solana toolchain and a local validator; see
# "What CI runs, and what it leaves out" in the README.
name: CI

on:
  push:
  pull_request:

# The runner image is pinned, like Rust in rust-toolchain.toml: with
# `ubuntu-latest` a new image (26.04 rolls out from 2026-10-19) could turn CI
# red with no change to the code. The price is bumping it by hand, and it is
# not pin-and-forget: GitHub supports only the latest two Ubuntu versions and
# retires the older one. Review when GitHub announces the next LTS on its
# runners (28.04, expected after its April 2028 release) — from then 24.04 is
# the third version, deprecated and later removed. Announcements:
# https://github.com/actions/runner-images/issues

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # With no argument, rustup installs the version in rust-toolchain.toml.
      # It runs before the cache so the cache key sees the right rustc.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p solana-token-swap --lib

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      # Vitest strips types without checking them, so a type error passes
      # `vitest run` green. This step is what makes it fail.
      - run: yarn typecheck
      - run: yarn test
